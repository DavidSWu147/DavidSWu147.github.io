// ============================================================
// SIMILI - A Dice Game by David Wu
// ============================================================

// --- Constants ---
const TOTAL_ROUNDS = 10;
const MAX_ROWS = 5;
const ROW_SIZE = 4;
const MAX_BOOK_DEFAULT = 3;
const MAX_BOOK_SEQ_BONUS = 4;
const MATCH_GAMES = 4;

// --- Utility Functions ---
function isValidSequence(digits) {
  if (digits.length < 2) return true;
  let asc = true;
  for (let i = 1; i < digits.length; i++) {
    if ((digits[i - 1] + 1) % 10 !== digits[i]) {
      asc = false;
      break;
    }
  }
  let desc = true;
  for (let i = 1; i < digits.length; i++) {
    if ((digits[i - 1] - 1 + 10) % 10 !== digits[i]) {
      desc = false;
      break;
    }
  }
  return asc || desc;
}
function canExtendSequence(existing, newDigit, position) {
  const all = [...existing, {
    digit: newDigit,
    pos: position
  }];
  if (all.length < 2) return true;
  const ascStarts = all.map(({
    digit,
    pos
  }) => (digit - pos + 40) % 10);
  const ascValid = ascStarts.every(s => s === ascStarts[0]);
  const descStarts = all.map(({
    digit,
    pos
  }) => (digit + pos) % 10);
  const descValid = descStarts.every(s => s === descStarts[0]);
  return ascValid || descValid;
}
function isValidLadderPlacement(row) {
  const a = row[0],
    b = row[1],
    c = row[2],
    d = row[3];
  if (a !== null && b !== null && a !== b) return false;
  if (c !== null && d !== null && c !== d) return false;
  const leftVal = a !== null ? a : b;
  const rightVal = c !== null ? c : d;
  if (leftVal !== null && rightVal !== null) {
    const diff = Math.abs(leftVal - rightVal);
    if (diff !== 1 && diff !== 9) return false;
  }
  return true;
}
function isValidLaxLadderPlacement(row) {
  const filled = row.filter(c => c !== null);
  if (filled.length === 0) return true;
  if (filled.length === 1) return true;
  const distinct = [...new Set(filled)];
  if (distinct.length > 2) return false;
  if (distinct.length === 1) {
    if (filled.length > 2) return false;
    return true;
  }
  const diff = Math.abs(distinct[0] - distinct[1]);
  if (diff !== 1 && diff !== 9) return false;
  const count0 = filled.filter(d => d === distinct[0]).length;
  const count1 = filled.filter(d => d === distinct[1]).length;
  if (count0 > 2 || count1 > 2) return false;
  return true;
}
function scoreLadderRow(cells, laxPlacement = false) {
  const filled = cells.filter(c => c !== null);
  if (filled.length !== 4) return 0;
  if (laxPlacement) {
    const sorted = [...filled].sort((a, b) => a - b);
    if (sorted[0] === sorted[1] && sorted[2] === sorted[3] && sorted[0] !== sorted[2]) {
      const diff = Math.abs(sorted[0] - sorted[2]);
      if (diff === 1 || diff === 9) return 20;
    }
    return 0;
  }
  return isValidLadderPlacement(cells) ? 20 : 0;
}
function scoreSequenceRow(cells) {
  const filled = cells.filter(c => c !== null);
  if (filled.length >= 4 && isValidSequence(filled)) return 15;
  if (filled.length >= 3) {
    const positions = cells.map((c, i) => c !== null ? i : -1).filter(i => i !== -1);
    for (let start = 0; start <= positions.length - 3; start++) {
      const group = positions.slice(start, start + 3);
      if (group[2] - group[0] === 2) {
        const digits = group.map(i => cells[i]);
        if (isValidSequence(digits)) return 10;
      }
    }
  }
  return 0;
}
function scoreMatchingRow(cells, laxPlacement = false) {
  const filled = cells.filter(c => c !== null);
  if (filled.length === 0) return 0;
  const allSame = filled.every(d => d === filled[0]);
  if (!allSame) return 0;
  if (filled.length >= 4) return 20;
  if (filled.length >= 3) {
    if (laxPlacement) return 15;
    const positions = cells.map((c, i) => c !== null ? i : -1).filter(i => i !== -1);
    for (let start = 0; start <= positions.length - 3; start++) {
      const group = positions.slice(start, start + 3);
      if (group[2] - group[0] === 2) return 15;
    }
    return 0;
  }
  return 0;
}
function scoreRow(category, cells, laxPlacement = false) {
  if (category === 'sequence') return scoreSequenceRow(cells);
  if (category === 'matching') return scoreMatchingRow(cells, laxPlacement);
  if (category === 'ladder') return scoreLadderRow(cells, laxPlacement);
  return 0;
}
function totalScore(grids, laxPlacement = false) {
  let total = 0;
  for (const cat of ['sequence', 'matching', 'ladder']) {
    for (const row of grids[cat]) {
      total += scoreRow(cat, row, laxPlacement);
    }
  }
  return total;
}
function hasSequenceBonusI(grids) {
  return grids.sequence.some(row => scoreSequenceRow(row) >= 10);
}
function countCompletedSequences3(grids) {
  return grids.sequence.filter(row => scoreSequenceRow(row) >= 10).length;
}
function countCompletedSequences4(grids) {
  return grids.sequence.filter(row => scoreSequenceRow(row) >= 15).length;
}
function hasSequenceBonusIIA(grids) {
  return countCompletedSequences3(grids) >= 5;
}
function hasSequenceBonusIIB(grids) {
  return countCompletedSequences4(grids) >= 4;
}
function hasSequenceBonusIII(grids) {
  return countCompletedSequences4(grids) >= 5;
}
function hasModernBonusIII(grids, laxPlacement = false) {
  if (countCompletedSequences4(grids) >= 5) return true;
  if (grids.matching.every(row => scoreMatchingRow(row, laxPlacement) >= 20)) return true;
  if (grids.ladder.every(row => scoreLadderRow(row, laxPlacement) >= 20)) return true;
  return false;
}

// --- Cell Hint Calculations ---
function getSequenceHints(row) {
  const hints = [null, null, null, null];
  const filled = row.map((c, i) => c !== null ? {
    digit: c,
    pos: i
  } : null).filter(Boolean);
  if (filled.length === 0 || filled.length === 4) return hints;
  for (let colIdx = 0; colIdx < 4; colIdx++) {
    if (row[colIdx] !== null) continue;
    const candidates = [];
    for (let d = 0; d <= 9; d++) {
      if (canExtendSequence(filled, d, colIdx)) candidates.push(d);
    }
    if (candidates.length > 0) hints[colIdx] = candidates;
  }
  return hints;
}
function getMatchingHints(row) {
  const hints = [null, null, null, null];
  const filled = row.filter(c => c !== null);
  if (filled.length === 0 || filled.length === 4) return hints;
  const target = filled[0];
  for (let colIdx = 0; colIdx < 4; colIdx++) {
    if (row[colIdx] !== null) continue;
    hints[colIdx] = [target];
  }
  return hints;
}
function getLadderHints(row, laxPlacement) {
  const hints = [null, null, null, null];
  const filled = row.filter(c => c !== null);
  if (filled.length === 0 || filled.length === 4) return hints;
  for (let colIdx = 0; colIdx < 4; colIdx++) {
    if (row[colIdx] !== null) continue;
    const candidates = [];
    for (let d = 0; d <= 9; d++) {
      const newRow = [...row];
      newRow[colIdx] = d;
      if (laxPlacement ? isValidLaxLadderPlacement(newRow) : isValidLadderPlacement(newRow)) candidates.push(d);
    }
    if (candidates.length > 0) hints[colIdx] = candidates;
  }
  return hints;
}
function getCellHints(category, row, laxPlacement) {
  if (category === 'sequence') return getSequenceHints(row);
  if (category === 'matching') return getMatchingHints(row);
  if (category === 'ladder') return getLadderHints(row, laxPlacement);
  return [null, null, null, null];
}

// --- Unwinnable Detection ---
function isUnwinnableSequence(bank) {
  if (bank.length !== 30) return false;
  const counts = Array(10).fill(0);
  for (const b of bank) counts[b.digit]++;
  const distinct = counts.filter(c => c > 0).length;
  if (distinct === 5) {
    const evens = [0, 2, 4, 6, 8];
    const odds = [1, 3, 5, 7, 9];
    const allEven = evens.every(d => counts[d] > 0) && odds.every(d => counts[d] === 0);
    const allOdd = odds.every(d => counts[d] > 0) && evens.every(d => counts[d] === 0);
    if (allEven || allOdd) {
      const vals = (allEven ? evens : odds).map(d => counts[d]);
      const mod4 = vals.map(v => v % 4);
      if (mod4.filter(m => m === 3).length === 4 && mod4.filter(m => m === 2).length === 1) return true;
    }
  }
  if (distinct === 6) {
    const unwinnablePatterns = [[0, 1, 3, 4, 6, 8], [0, 1, 3, 5, 6, 8], [0, 1, 3, 5, 7, 8], [0, 2, 3, 5, 6, 8], [0, 2, 3, 5, 7, 8], [0, 2, 3, 5, 7, 9], [0, 2, 4, 5, 7, 8], [0, 2, 4, 5, 7, 9], [0, 2, 4, 6, 7, 9], [1, 2, 4, 5, 7, 9], [1, 2, 4, 6, 7, 9], [1, 2, 4, 6, 8, 9], [1, 3, 4, 6, 7, 9], [1, 3, 4, 6, 8, 9], [1, 3, 5, 6, 8, 9]];
    const presentDigits = [];
    for (let d = 0; d < 10; d++) if (counts[d] > 0) presentDigits.push(d);
    for (const pattern of unwinnablePatterns) {
      if (pattern.length !== presentDigits.length) continue;
      if (!pattern.every((d, i) => d === presentDigits[i])) continue;
      const adjacentPairs = [];
      for (let i = 0; i < pattern.length; i++) for (let j = i + 1; j < pattern.length; j++) {
        const diff = Math.abs(pattern[i] - pattern[j]);
        if (diff === 1 || diff === 9) adjacentPairs.push([pattern[i], pattern[j]]);
      }
      let laddersBlocked = true;
      for (const [a, b] of adjacentPairs) {
        const aSingle = counts[a] === 1,
          bSingle = counts[b] === 1;
        if (!(aSingle && !bSingle || !aSingle && bSingle)) {
          laddersBlocked = false;
          break;
        }
      }
      if (!laddersBlocked) continue;
      const nonSingletons = pattern.filter(d => counts[d] > 1);
      if (nonSingletons.length !== 4) continue;
      if (nonSingletons.every(d => counts[d] % 4 === 3)) return true;
    }
  }
  return false;
}

// --- Helper: Create fresh player state ---
function createPlayerState() {
  return {
    grids: {
      sequence: Array.from({
        length: MAX_ROWS
      }, () => Array(ROW_SIZE).fill(null)),
      matching: Array.from({
        length: MAX_ROWS
      }, () => Array(ROW_SIZE).fill(null)),
      ladder: Array.from({
        length: MAX_ROWS
      }, () => Array(ROW_SIZE).fill(null))
    },
    bankUsed: [],
    selectedBankIndices: [],
    chosenCategory: null,
    bookingsThisRound: 0,
    maxBooking: MAX_BOOK_DEFAULT,
    seqBonusIIAUsed: false,
    seqBonusIIBUsed: false,
    seqBonusIIAUnlocked: false,
    seqBonusIIBUnlocked: false,
    seqBonusIIACategory: null,
    seqBonusIIBCategory: null,
    bonusBookPhase: false,
    bonusBookSource: null,
    undoStack: [],
    roundDone: false,
    bookedPerRound: [],
    hint: null // { note, cells } while the board shows the Hint's booking
  };
}
function hasQuadBonus(grids, laxPlacement) {
  return grids.matching.some(row => scoreMatchingRow(row, laxPlacement) >= 20);
}
function getPlayerFinalScore(ps, classicMode, laxPlacement, quadBonusEnabled) {
  const grids = ps.grids;
  const seqBonusIII = classicMode ? hasSequenceBonusIII(grids) : hasModernBonusIII(grids, laxPlacement);
  const qb = quadBonusEnabled && hasQuadBonus(grids, laxPlacement) ? 1 : 0;
  return totalScore(grids, laxPlacement) + (seqBonusIII ? 5 : 0) + qb;
}

// --- Round 10 Win Chance & Outs Computation ---

// Generate all 220 distinct rolls (sorted triples) with their weights
function generateDistinctRolls() {
  const rolls = [];
  for (let a = 0; a <= 9; a++) {
    for (let b = a; b <= 9; b++) {
      for (let c = b; c <= 9; c++) {
        let weight;
        if (a === b && b === c) weight = 1;else if (a === b || b === c) weight = 3;else weight = 6;
        rolls.push({
          digits: [a, b, c],
          weight
        });
      }
    }
  }
  return rolls;
}
const DISTINCT_ROLLS = generateDistinctRolls();

// --- Round 10 win chances, standalone (no ai/simili-solver.js needed) ---
// Exact: a roll wins if some legal booking of the round reaches 100 (with Bonus III).
// Used when ai/simili-solver.js is missing, and by ai/test as an independent check of
// the solver. Built only from the game's own row rules (canExtendSequence,
// isValidLadderPlacement, scoreRow) and bonus rules:
//  - up to maxBook main books (3, or 4 in Sequence with Bonus I), all in the chosen category;
//  - each free book (II-A, and II-B in Modern) can be used once, as soon as its bonus is
//    unlocked on the board at that moment, including by bookings made earlier in this
//    round (5 Sequence rows of 10+ for II-A, 4 of 15 for II-B), anywhere, except that if
//    the other free book went outside Sequence, this one must go into Sequence.
// How: every way to raise each row's score (all fillings of its empty cells checked with
// the row rules), then a search over one way per row within the digits and books
// available. A combination that reaches 100 counts if its bookings can be made in some
// legal order: main books first (they never wait for anything; an earlier booking can
// only unlock more), then the free books one at a time, trying every choice of which
// digits are the free ones, their order and which bonus each uses.
const R10_CATS = ['sequence', 'matching', 'ladder'];
function r10RowLegal(cat, row) {
  if (cat === 'sequence') {
    const ex = [];
    for (let i = 0; i < 4; i++) if (row[i] !== null) {
      if (!canExtendSequence(ex, row[i], i)) return false;
      ex.push({
        digit: row[i],
        pos: i
      });
    }
    return true;
  }
  if (cat === 'matching') {
    const f = row.filter(x => x !== null);
    return f.every(d => d === f[0]);
  }
  return isValidLadderPlacement(row);
}
// Every way to raise the score of one row by filling some of its empty cells, once per
// equivalent way: { cat, row, digits (sorted), cost[10], n, score, partial }
// (partial[mask], Sequence only: the row's score without the added digits in `mask`).
function r10RowOptions(cat, rowIdx, row) {
  const base = scoreRow(cat, row, false);
  const empty = [];
  for (let i = 0; i < 4; i++) if (row[i] === null) empty.push(i);
  const out = new Map();
  const cur = [...row];
  const add = [];
  const visit = j => {
    if (j === empty.length) {
      if (!add.length) return;
      if (!r10RowLegal(cat, cur)) return;
      const score = scoreRow(cat, cur, false);
      if (score <= base) return;
      const placed = add.slice().sort((a, b) => a.digit - b.digit || a.col - b.col);
      let partial = null;
      if (cat === 'sequence') {
        partial = [];
        for (let mask = 0; mask < 1 << placed.length; mask++) {
          const r = [...cur];
          placed.forEach((p, k) => {
            if (mask & 1 << k) r[p.col] = null;
          });
          partial.push(scoreSequenceRow(r));
        }
      }
      const digits = placed.map(p => p.digit);
      const key = digits.join('') + '|' + score + '|' + (partial ? partial.join(',') : '');
      if (!out.has(key)) {
        const cost = new Array(10).fill(0);
        for (const d of digits) cost[d]++;
        out.set(key, {
          cat,
          row: rowIdx,
          digits,
          cost,
          n: digits.length,
          score,
          gain: score - base,
          partial
        });
      }
      return;
    }
    visit(j + 1);
    for (let d = 0; d <= 9; d++) {
      cur[empty[j]] = d;
      add.push({
        col: empty[j],
        digit: d
      });
      visit(j + 1);
      add.pop();
      cur[empty[j]] = null;
    }
  };

  return [...out.values()];
}
// Everything about one position that does not depend on the roll or the category.
function r10Prepare(ps, classicMode) {
  const grids = ps.grids;
  const rows = [];
  for (const cat of R10_CATS) for (let i = 0; i < MAX_ROWS; i++) {
    const options = r10RowOptions(cat, i, grids[cat][i]);
    rows.push({
      cat,
      row: i,
      base: scoreRow(cat, grids[cat][i], false),
      options
    });
  }
  const used = (u, c) => !u ? 0 : c === '?' ? 2 : 1; // 0 unused, 1 used in Sequence, 2 used elsewhere
  return {
    grids,
    classicMode,
    rows,
    baseScore: totalScore(grids, false),
    bonusI: hasSequenceBonusI(grids),
    uA: used(ps.seqBonusIIAUsed, ps.seqBonusIIACategory),
    uB: classicMode ? 1 : used(ps.seqBonusIIBUsed, ps.seqBonusIIBCategory),
    unlockedA: !!ps.seqBonusIIAUnlocked,
    unlockedB: !classicMode && !!ps.seqBonusIIBUnlocked

// Can this choice of row options (`pick`, one per row at most) be booked legally?
function r10Feasible(P, pick, category, maxBook) {
  const all = [];
  pick.forEach((o, oi) => o.digits.forEach((d, k) => all.push({
    oi,
    k,
    inCat: o.cat === category,
    seq: o.cat === 'sequence'

    nOut = all.length - nIn;

  const letters = [];

  if (P.uB === 0) letters.push('B');
  if (free > letters.length) return false;

    inside = all.filter(x => x.inCat);
  // Sequence rows' scores with the given digits left out: how many score 10+ and 15
  const counts = removed => {
    let c10 = 0,
      c15 = 0;
    for (const r of P.rows) {
      if (r.cat !== 'sequence') continue;
      const oi = pick.findIndex(o => o.cat === 'sequence' && o.row === r.row);
      let s = r.base;
      if (oi >= 0) {

      if (s >= 15) c15++;

      c10,
      c15

  if (extra === 0) choices.push([]);else if (extra === 1) inside.forEach(x => choices.push([x]));else for (let i = 0; i < inside.length; i++) for (let j = i + 1; j < inside.length; j++) choices.push([inside[i], inside[j]]);

    const F = outside.concat(ch);
    const orders = F.length === 1 ? [F] : [F, [F[1], F[0]]];
    for (const ord of orders) {
      const lettersOrders = ord.length === 1 ? letters.map(L => [L]) : [['A', 'B'], ['B', 'A']];

          pending = ord.slice();

        for (let s = 0; s < ord.length && ok; s++) {
          const L = ls[s],
            x = ord[s];
          const c = counts(pending); // the board before this free book
          if (!unlocked(L, c)) {
            ok = false;
            break;
          }
          // the other free book went (earlier, or this round) outside Sequence: this one into Sequence
          const other = L === 'A' ? 'B' : 'A';
          const otherOut = (P.classicMode ? false : usedOf(other) === 2) || firstOutside.length > 0;
          if (otherOut && !x.seq) {
            ok = false;
            break;
          }
          if (!x.seq) firstOutside.push(x);
          pending = pending.filter(y => y !== x);
        }
        if (ok) return true;
      }
    }

  return false;
}
// Which rolls win for one category: { weight (of 1000), rolls (sorted digit triples) }.
function r10WinningRolls(P, bankCounts, category) {
  const maxBook = category === 'sequence' && P.bonusI ? MAX_BOOK_SEQ_BONUS : MAX_BOOK_DEFAULT;
  const freeMax = (P.uA === 0 ? 1 : 0) + (P.uB === 0 ? 1 : 0);
  const budget = maxBook + freeMax;
  const rows = P.rows.filter(r => r.options.length).sort((a, b) => a.options.length - b.options.length);
  // best gain from rows idx.. with at most k digits (one way per row): a bound for the search
  const best = Array.from({
    length: rows.length + 1
  }, () => new Array(budget + 1).fill(0));
  for (let i = rows.length - 1; i >= 0; i--) for (let k = 0; k <= budget; k++) {
    let b = best[i + 1][k];
    for (const o of rows[i].options) if (o.n <= k) b = Math.max(b, o.gain + best[i + 1][k - o.n]);
    best[i][k] = b;
  }
  const seq15 = P.rows.filter(r => r.cat === 'sequence' && r.base >= 15).length;
  const m20 = P.rows.filter(r => r.cat === 'matching' && r.base >= 20).length;
  const l20 = P.rows.filter(r => r.cat === 'ladder' && r.base >= 20).length;

    weight: 0,
    rolls: []

  if (P.baseScore + (bonusIII(seq15, m20, l20) ? 5 : 0) >= 100) {
    for (const r of DISTINCT_ROLLS) {
      out.weight += r.weight;
      out.rolls.push(r.digits);
    }
    return out;
  }
  const pool = new Array(10);
  for (const roll of DISTINCT_ROLLS) {
    for (let d = 0; d < 10; d++) pool[d] = bankCounts[d];
    for (const d of roll.digits) pool[d]++;
    const pick = [];
    let found = false;
    const dfs = (i, nUsed, gain, s15, m, l) => {
      if (found || i >= rows.length) return;
      const score = P.baseScore + gain;
      if (score + best[i][budget - nUsed] + 5 < 100) return;
      const r = rows[i];
      for (const o of r.options) {
        if (found) return;
        if (nUsed + o.n > budget) continue;
        let ok = true;
        for (let d = 0; d < 10; d++) if (o.cost[d] > pool[d]) {
          ok = false;
          break;
        }
        if (!ok) continue;
        for (let d = 0; d < 10; d++) pool[d] -= o.cost[d];
        pick.push(o);
